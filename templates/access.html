<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Access | Frontlines</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="/static/images/Logo-Blue.png">
</head>

<body>

    <!-- Website Navbar -->
    {% include 'components/navbar.html' %}


    <!-- Authentication Page -->

    <main class="auth-page">

        <div class="auth-header">

            <h1>Welcome to Frontlines</h1>

            <p>
                Sign in to your account or create a new account to begin.
            </p>

        </div>


        <div class="auth-container">


            <!-- SIGN UP -->

            <section class="auth-card">

                <div class="auth-card-header">

                    <h2>Create Account</h2>

                    <p>
                        Create your Frontlines account.
                    </p>

                </div>


                <form id="signupForm">

                    <div class="auth-form-group">

                        <label for="signupUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="signupUsername"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label for="signupEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>

                </form>

            </section>


            <!-- LOGIN -->

            <section class="auth-card">

                <div class="auth-card-header">

                    <h2>Sign In</h2>

                    <p>
                        Sign in to continue to Frontlines.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="auth-form-group">

                        <label for="loginUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="loginUsername"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Sign In
                    </button>

                </form>

            </section>


        </div>

    </main>


    <script>

        // =========================================================
        // SIGN UP
        // =========================================================

        document.getElementById("signupForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const response = await fetch("/signup", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        username:
                            document.getElementById("signupUsername").value,

                        email:
                            document.getElementById("signupEmail").value,

                        password:
                            document.getElementById("signupPassword").value

                    })

                });

                const data = await response.json();

                if (data.redirect) {

                    window.location.href = data.redirect;

                } else {

                    alert(data.message || data.error);

                }

            }
        );


        // =========================================================
        // LOGIN
        // =========================================================

        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        username:
                            document.getElementById("loginUsername").value,

                        password:
                            document.getElementById("loginPassword").value

                    })

                });

                const data = await response.json();

                if (data.redirect) {

                    window.location.href = data.redirect;

                } else {

                    alert(data.error);

                }

            }
        );

    </script>

</body>

</html>
