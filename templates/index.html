<!DOCTYPE html>
<html>
<head>
    <title>Unit Database Example</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Military Units</h1>

    <div class="unit-container">

        {% for unit in units %}

        <div class="unit-card">

            <h2>{{ unit.name }}</h2>

            <p>
                Strength:
                {{ unit.strength }}
            </p>

            <p>
                Defence:
                {{ unit.defence }}
            </p>

        </div>

        {% endfor %}

    </div>

</body>
</html>
