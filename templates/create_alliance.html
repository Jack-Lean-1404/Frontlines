<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Alliance</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/Logo-Blue.png') }}">
</head>

<body>

    {% include 'components/navbar.html' %}

    <main class="game-container">

        {% include "partials/nation_header.html" %}

        <section class="dashboard-card">

            <h2>Create Alliance</h2>

            <p>
                Create a new alliance for your nation.
            </p>

            <form method="POST">

                <div class="form-group">

                    <label for="alliance_name">
                        Alliance Name
                    </label>

                    <input
                        type="text"
                        id="alliance_name"
                        name="alliance_name"
                        maxlength="100"
                        required>

                </div>


                <div class="form-group">

                    <label for="alliance_code">
                        Alliance Code
                    </label>

                    <input
                        type="text"
                        id="alliance_code"
                        name="alliance_code"
                        maxlength="4"
                        minlength="4"
                        pattern="[A-Za-z]{4}"
                        required>

                    <small>
                        Enter a unique four-letter code.
                    </small>

                </div>


                <button
                    type="submit"
                    class="primary-button">

                    Create Alliance

                </button>

            </form>

        </section>
    </main> 
</body>

{% include 'partials/footer.html' %}
