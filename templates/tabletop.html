<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frontlines — Strategic Map</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='tabletop.css') }}"
    >

</head>

<body>

    <div id="map-viewport">

        <div id="map-world">

            <img
                id="game-map"
                src="{{ url_for('static', filename='maps/Game-Map-test.svg') }}"
                draggable="false"
            >

            <div id="test-unit">

                <div class="counter-tier">
                    XXXXX
                </div>

                <div class="counter-image">

                    <img
                        id="unit-icon"
                        src="{{ url_for('static', filename='images/unit_icons/Mechanised_Infantry.png') }}"
                        draggable="false"
                    >

                </div>

                <div class="counter-nation">
                    SATO
                </div>

            </div>

        </div>

    </div>


    <div id="coordinates">

        X: <span id="coord-x">0</span>
        Y: <span id="coord-y">0</span>

    </div>


    <div id="zoom-display">

        Zoom: <span id="zoom">100%</span>

    </div>


    <script
        src="{{ url_for('static', filename='js/tabletop.js') }}"
    ></script>

</body>

</html>
