<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
    
 <!-- Display the navbar from the components folder -->
{% include 'components/navbar.html' %}

<body>
    <h1>Admin Panel</h1>

    <p>Welcome, {{ session.username }}!</p>

    <h2>Assign Nations To Players</h2>

    {% for user in users %}

        <div>

            <p>{{ user.username }}</p>

            <form method="POST" action="/admin/assign_nation">

                <input
                    type="hidden"
                    name="user_id"
                    value="{{ user.user_id }}"
                >

                <select name="nation_id">

                    {% for nation in nations %}

                        <option value="{{ nation.nation_id }}">

                            {{ nation.name }}

                        </option>

                    {% endfor %}

                </select>

                <button type="submit">

                    Assign Nation

                </button>

            </form>

        </div>

    {% endfor %}


</body>
</html>
